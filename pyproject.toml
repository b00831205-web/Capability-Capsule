[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "capability-capsule"
version = "0.1.0"
description = "Local-first, task-specific capability packages for offline work."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.3,<3",
  "pathspec>=0.12,<1",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
capsule = "capability_capsule.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capability_capsule"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.uv]
package = true
